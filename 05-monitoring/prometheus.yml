global:
  scrape_interval: 15s 

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090'] 
  
  - job_name: 'cadvisor' 
    static_configs:
      - targets: ['server_ip:8080']
  
  - job_name: 'nodeexporter'
    static_configs:
      - targets: ['server_ip:9100']

  - job_name: 'postgres'
    static_configs:
      - targets: ['server_ip:9187']

  - job_name: 'backend'
    metrics_path: '/manage/prometheus'
    static_configs:
      - targets: ['server_ip:8081']

